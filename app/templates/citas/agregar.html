{% extends "base.html" %}
{% block contenido %}
<h3>Agregar Nueva Cita</h3>
<form method="POST">
  <div class="form-group">
    <label>Fecha</label>
    <input type="date" name="fecha" class="form-control" required>
  </div>
  <div class="form-group">
    <label>Hora</label>
    <input type="time" name="hora" class="form-control" required>
  </div>
  <div class="form-group">
    <label>Médico</label>
    <select name="medico_id" class="form-control" required>
      <option value="">-- Selecciona un médico --</option>
      {% for m in medicos %}
      <option value="{{ m.id }}">{{ m.nombre }} — {{ m.especialidad }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Paciente</label>
    <select name="paciente_id" class="form-control" required>
      <option value="">-- Selecciona un paciente --</option>
      {% for p in pacientes %}
      <option value="{{ p.id }}">{{ p.nombre }} — {{ p.telefono }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-success">Guardar</button>
  <a href="{{ url_for('citas.listar') }}" class="btn btn-default">Volver</a>
</form>
{% endblock %}
