{% extends "base.html" %}
{% block contenido %}
<h3>Editar Cita</h3>
<form method="POST">
  <div class="form-group">
    <label>Fecha</label>
    <input type="date" name="fecha" class="form-control" value="{{ cita.fecha.strftime('%Y-%m-%d') }}" required>
  </div>
  <div class="form-group">
    <label>Hora</label>
    <input type="time" name="hora" class="form-control" value="{{ cita.hora.strftime('%H:%M') }}" required>
  </div>
  <div class="form-group">
    <label>Médico</label>
    <select name="medico_id" class="form-control" required>
      {% for m in medicos %}
      <option value="{{ m.id }}" {% if m.id == cita.medico_id %}selected{% endif %}>
        {{ m.nombre }} — {{ m.especialidad }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Paciente</label>
    <select name="paciente_id" class="form-control" required>
      {% for p in pacientes %}
      <option value="{{ p.id }}" {% if p.id == cita.paciente_id %}selected{% endif %}>
        {{ p.nombre }} — {{ p.telefono }}
      </option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Actualizar</button>
  <a href="{{ url_for('citas.listar') }}" class="btn btn-default">Volver</a>
</form>
{% endblock %}
